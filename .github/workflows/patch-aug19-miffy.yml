name: patch-aug19-miffy

on:
  push:
    paths:
      - .github/workflows/patch-aug19-miffy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Miffy Store to Aug 19 evening
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'personal-work/2026/01-vacation/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '<div class="day start"><span class="num">19</span><button class="event green-event" type="button" data-date="19">서울 톨게이트 통과<small>10:57 · 경주 이동 중</small></button><button class="event green-event" type="button" data-date="19">Aventa Hotel<small>16:00 전후 도착 · 체크인</small></button><button class="event green-event" type="button" data-date="19">불국사<small>17:00–18:30 · 저녁 관람</small></button></div>',
              '<div class="day start"><span class="num">19</span><button class="event green-event" type="button" data-date="19">서울 톨게이트 통과<small>10:57 · 경주 이동 중</small></button><button class="event green-event" type="button" data-date="19">Aventa Hotel<small>16:00 전후 도착 · 체크인</small></button><button class="event green-event" type="button" data-date="19">불국사<small>17:00–18:30 · 저녁 관람</small></button><button class="event green-event" type="button" data-date="19">미피스토어 경주<small>19:00–19:40 · 황리단길</small></button></div>'
            ],
            [
              '<div><strong>서울 톨게이트 통과 → 경주 이동·불국사</strong><p>10:57 경부고속도로 서울 톨게이트 통과 기준으로 경주 이동, 중간 점심·휴식 포함</p><p>Aventa 16:00 전후 체크인 후 17:00 불국사 저녁 관람으로 조정</p></div>',
              '<div><strong>서울 톨게이트 통과 → 불국사·미피스토어</strong><p>10:57 경부고속도로 서울 톨게이트 통과 기준으로 경주 이동, 중간 점심·휴식 포함</p><p>Aventa 체크인 후 17:00 불국사, 19:00 미피스토어 경주 방문으로 조정</p></div>'
            ],
            [
              '19: { label: "8월 19일 수요일", progress: "1일차", title: "서울 톨게이트 → 경주·불국사", description: "10:57 서울 톨게이트 통과 · 중간 점심·휴식 · Aventa 16:00 전후 체크인 · 17:00 불국사 저녁 관람", day: "경주" },',
              '19: { label: "8월 19일 수요일", progress: "1일차", title: "서울 톨게이트 → 불국사·미피스토어", description: "10:57 서울 톨게이트 통과 · Aventa 체크인 · 17:00 불국사 저녁 관람 · 19:00 미피스토어 경주 방문", day: "경주" },'
            ],
            [
              '19: {\n        kicker: "8월 19일 이동·관람",\n        title: "서울 톨게이트 → 경주·불국사",\n        description: "10:57 서울 톨게이트 통과 기준으로 경주 이동 후 Aventa 체크인, 저녁에는 불국사를 짧게 관람하는 흐름입니다. 호텔에서 16:30 전후 다시 출발하는 것을 목표로 잡습니다.",\n        map: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC",\n        link: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC",\n        linkLabel: "불국사 지도"\n      },',
              '19: {\n        kicker: "8월 19일 이동·관람",\n        title: "서울 톨게이트 → 불국사·미피스토어",\n        description: "Aventa 체크인 후 17:00 전후 불국사를 짧게 관람하고, 19:00 전후 황리단길 미피스토어 경주에 들릅니다. 미피스토어는 20:00 전후 마감 가능성이 있어 불국사에서 늦어지면 미피스토어를 우선하세요.",\n        map: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EB%AF%B8%ED%94%BC%EC%8A%A4%ED%86%A0%EC%96%B4",\n        link: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EB%AF%B8%ED%94%BC%EC%8A%A4%ED%86%A0%EC%96%B4",\n        linkLabel: "미피스토어 지도"\n      },'
            ],
            [
              '{ title: "불국사 저녁 관람", text: "호텔에서 16:30 전후 출발하면 17:00 전후 도착해 다보탑·석가탑·대웅전 중심으로 60–90분 짧게 관람합니다. 늦어지면 동궁과 월지 야경으로 전환하세요.", href: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC", link: "네이버 지도 ↗" },\n        { title: "통행료 예산",',
              '{ title: "불국사 저녁 관람", text: "호텔에서 16:30 전후 출발하면 17:00 전후 도착해 다보탑·석가탑·대웅전 중심으로 60–90분 짧게 관람합니다. 늦어지면 동궁과 월지 야경으로 전환하세요.", href: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC", link: "네이버 지도 ↗" },\n        { title: "미피스토어 경주", text: "불국사 후 19:00 전후 황리단길 미피스토어 경주를 방문합니다. 20:00 전후 마감 가능성이 있으므로 굿즈 구매가 목적이면 늦지 않게 이동하세요.", href: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EB%AF%B8%ED%94%BC%EC%8A%A4%ED%86%A0%EC%96%B4", link: "네이버 지도 ↗" },\n        { title: "통행료 예산",'
            ],
            [
              '19: [\n        { start: "10:57", end: "13:10", title: "서울 톨게이트 → 휴게소 이동", detail: "경부고속도로 진입·경주 방향 이동", kind: "travel" },\n        { start: "13:10", end: "13:50", title: "점심·휴식", detail: "휴게소 식사·화장실·충전 확인", kind: "stay" },\n        { start: "13:50", end: "16:00", title: "휴게소 → 경주 이동", detail: "Aventa Hotel 도착·체크인 준비", kind: "travel" },\n        { start: "16:00", end: "16:30", title: "Aventa Hotel 체크인", detail: "짐 정리 후 바로 출발 준비", kind: "stay" },\n        { start: "16:30", end: "17:00", title: "Aventa → 불국사 이동", detail: "저녁 관람 이동", kind: "travel" },\n        { start: "17:00", end: "18:30", title: "불국사 저녁 관람", detail: "다보탑·석가탑·대웅전 중심 짧은 관람", kind: "travel" },\n        { start: "18:30", end: "19:00", title: "불국사 → 저녁 식사 이동", detail: "관람 후 식사 장소로 이동", kind: "travel" }\n      ],',
              '19: [\n        { start: "10:57", end: "13:10", title: "서울 톨게이트 → 휴게소 이동", detail: "경부고속도로 진입·경주 방향 이동", kind: "travel" },\n        { start: "13:10", end: "13:50", title: "점심·휴식", detail: "휴게소 식사·화장실·충전 확인", kind: "stay" },\n        { start: "13:50", end: "16:00", title: "휴게소 → 경주 이동", detail: "Aventa Hotel 도착·체크인 준비", kind: "travel" },\n        { start: "16:00", end: "16:30", title: "Aventa Hotel 체크인", detail: "짐 정리 후 바로 출발 준비", kind: "stay" },\n        { start: "16:30", end: "17:00", title: "Aventa → 불국사 이동", detail: "저녁 관람 이동", kind: "travel" },\n        { start: "17:00", end: "18:30", title: "불국사 저녁 관람", detail: "다보탑·석가탑·대웅전 중심 짧은 관람", kind: "travel" },\n        { start: "18:30", end: "19:00", title: "불국사 → 황리단길 이동", detail: "미피스토어 경주 이동", kind: "travel" },\n        { start: "19:00", end: "19:40", title: "미피스토어 경주", detail: "황리단길 굿즈 쇼핑", kind: "stay" },\n        { start: "19:40", end: "20:00", title: "저녁 식사 이동", detail: "황리단길 또는 숙소 방향", kind: "travel" }\n      ],'
            ],
            [
              '      const scheduleStartHour = filter === "21" ? 10 : 8;\n      const scheduleEndHour = filter === "21" ? 21 : 19;',
              '      const scheduleStartHour = filter === "21" ? 10 : 8;\n      const scheduleEndHour = filter === "21" ? 21 : (filter === "19" ? 20 : 19);'
            ]
          ];

          for (const [from, to] of replacements) {
            if (!html.includes(from)) {
              throw new Error(`Expected text not found: ${from.slice(0, 180)}`);
            }
            html = html.replace(from, to);
          }

          fs.writeFileSync(path, html);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-aug19-miffy.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-work/2026/01-vacation/index.html .github/workflows/patch-aug19-miffy.yml
          git commit -m "Add Miffy Store to Aug 19 evening schedule"
          git push
