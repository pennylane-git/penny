name: patch-aug21-night-route

on:
  push:
    paths:
      - .github/workflows/patch-aug21-night-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Aug 21 night route schedule
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'personal-work/2026/01-vacation/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '<div class="day"><span class="num">21</span><button class="event green-event" type="button" data-date="21">경주월드<small>10:00–19:00 · 놀이기구</small></button><button class="event green-event" type="button" data-date="21">경주 숙박<small>Aventa</small></button></div>',
              '<div class="day"><span class="num">21</span><button class="event green-event" type="button" data-date="21">경주월드<small>10:00–17:30 · 놀이기구</small></button><button class="event green-event" type="button" data-date="21">동궁과 월지<small>18:00–19:15 · 야경</small></button><button class="event green-event" type="button" data-date="21">월정교·교촌마을·첨성대<small>19:30–21:00 · 야경 산책</small></button><button class="event green-event" type="button" data-date="21">경주 숙박<small>Aventa</small></button></div>'
            ],
            [
              '<div><strong>경주월드 놀이기구</strong><p>10:00부터 19:00까지 인기 어트랙션과 점심·휴식 시간을 여유 있게 배치했습니다.</p></div>',
              '<div><strong>경주월드 → 동궁과 월지 야경</strong><p>10:00부터 경주월드를 이용하고 17:30 퇴장을 목표로 잡습니다.</p><p>18:00 동궁과 월지, 19:30 월정교·교촌마을, 20:35 첨성대 야경으로 이어갑니다.</p></div>'
            ],
            [
              '21: { label: "8월 21일 금요일", progress: "3일차", title: "경주월드 놀이기구", description: "10:00–19:00 인기 어트랙션 · 점심과 대기 시간을 고려한 하루 일정", day: "경주" },',
              '21: { label: "8월 21일 금요일", progress: "3일차", title: "경주월드 → 동궁과 월지 야경", description: "10:00–17:30 경주월드 · 18:00–19:15 동궁과 월지 · 19:30–20:25 월정교·교촌마을 · 20:35–21:00 첨성대", day: "경주" },'
            ],
            [
              '21: {\n        kicker: "놀이공원 메모",\n        title: "경주월드 동선",\n        description: "오전에는 인기 어트랙션을 먼저 타고, 점심 이후에는 대기 시간을 보며 실내·휴식형 콘텐츠를 섞으면 체력이 덜 소모됩니다.",\n        map: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%EC%9B%94%EB%93%9C",\n        link: "https://smart.gjw.co.kr/reservation/amusement/SMBIA002.do",\n        linkLabel: "이용권 확인"\n      },',
              '21: {\n        kicker: "놀이공원·야경 동선",\n        title: "경주월드 → 동궁과 월지 → 월정교·첨성대",\n        description: "17:30 경주월드 퇴장을 목표로 하면 18:00 전후 동궁과 월지에 도착해 해 질 무렵부터 야경 전환까지 볼 수 있습니다. 이후 월정교, 교촌마을 짧은 산책, 첨성대 순서가 동선상 가장 효율적입니다.",\n        map: "https://map.naver.com/p/search/%EB%8F%99%EA%B6%81%EA%B3%BC%20%EC%9B%94%EC%A7%80",\n        link: "https://map.naver.com/p/search/%EB%8F%99%EA%B6%81%EA%B3%BC%20%EC%9B%94%EC%A7%80",\n        linkLabel: "동궁과 월지 지도"\n      },'
            ],
            [
              '21: [\n        { title: "추천 순서", text: "10:00 입장 후 인기 어트랙션을 먼저 이용하고, 12:30 점심·휴식 뒤 오후 일정으로 이어갑니다." },\n        { title: "준비물", text: "편한 신발·우비·보조배터리. 우천 시 운휴 시설과 실내 대체 콘텐츠를 확인하세요." },\n        { title: "체력 배분", text: "13:30 이후에는 대기 시간과 퍼레이드 시간을 보며 휴식 구간을 유동적으로 두세요." },\n        { title: "이용 정보", text: "운영시설·주차·이용권 정보를 공식 페이지에서 출발 전 확인하세요.", href: "https://smart.gjw.co.kr/reservation/amusement/SMBIA002.do", link: "공식 정보 ↗" }\n      ],',
              '21: [\n        { title: "경주월드 운영", text: "10:00 입장 후 인기 어트랙션을 먼저 이용하고, 오후에는 대기 시간과 체력에 맞춰 17:30 퇴장을 목표로 조정합니다." },\n        { title: "동궁과 월지", text: "18:00–19:15 야경 관람. 해 질 무렵부터 조명이 켜지는 전환 시간을 볼 수 있는 핵심 일정입니다.", href: "https://map.naver.com/p/search/%EB%8F%99%EA%B6%81%EA%B3%BC%20%EC%9B%94%EC%A7%80", link: "네이버 지도 ↗" },\n        { title: "월정교·교촌마을", text: "19:30–20:25 월정교 야경 후 교촌마을은 상점보다 한옥길 분위기 산책 중심으로 짧게 봅니다.", href: "https://map.naver.com/p/search/%EC%9B%94%EC%A0%95%EA%B5%90", link: "월정교 지도 ↗" },\n        { title: "첨성대", text: "20:35–21:00 첨성대 야경을 짧게 보고 숙소 복귀 또는 늦은 저녁으로 전환합니다.", href: "https://map.naver.com/p/search/%EC%B2%A8%EC%84%B1%EB%8C%80", link: "첨성대 지도 ↗" },\n        { title: "이용 정보", text: "경주월드 운영시설·주차·이용권 정보는 공식 페이지에서 출발 전 확인하세요.", href: "https://smart.gjw.co.kr/reservation/amusement/SMBIA002.do", link: "공식 정보 ↗" }\n      ],'
            ],
            [
              '21: [\n        { start: "10:00", end: "12:30", title: "경주월드 어트랙션", detail: "오전 인기 놀이기구", kind: "travel" },\n        { start: "12:30", end: "13:30", title: "점심·휴식", detail: "파크 내 식사 및 대기 동선 정리", kind: "stay" },\n        { start: "13:30", end: "18:00", title: "경주월드 어트랙션", detail: "오후 놀이기구·퍼레이드 관람", kind: "travel" },\n        { start: "18:00", end: "19:00", title: "저녁 식사", detail: "경주 저녁 식사", kind: "stay" }\n      ],',
              '21: [\n        { start: "10:00", end: "12:30", title: "경주월드 어트랙션", detail: "오전 인기 놀이기구", kind: "travel" },\n        { start: "12:30", end: "13:30", title: "점심·휴식", detail: "파크 내 식사 및 대기 동선 정리", kind: "stay" },\n        { start: "13:30", end: "17:30", title: "경주월드 어트랙션", detail: "오후 놀이기구 후 17:30 퇴장 목표", kind: "travel" },\n        { start: "17:30", end: "18:00", title: "경주월드 → 동궁과 월지 이동", detail: "야경 관람 이동", kind: "travel" },\n        { start: "18:00", end: "19:15", title: "동궁과 월지 야경", detail: "해 질 무렵부터 조명 반영 관람", kind: "travel" },\n        { start: "19:15", end: "19:30", title: "동궁과 월지 → 월정교 이동", detail: "시내권 짧은 이동", kind: "travel" },\n        { start: "19:30", end: "20:00", title: "월정교 야경", detail: "남천 반영 포인트", kind: "travel" },\n        { start: "20:00", end: "20:25", title: "교촌마을 산책", detail: "한옥길 분위기 중심 짧은 산책", kind: "travel" },\n        { start: "20:25", end: "20:35", title: "교촌마을 → 첨성대 이동", detail: "첨성대 야경 이동", kind: "travel" },\n        { start: "20:35", end: "21:00", title: "첨성대 야경", detail: "짧은 야경 관람 후 저녁 또는 숙소 복귀", kind: "travel" }\n      ],'
            ],
            [
              '    const scheduleEvents = document.querySelector(".schedule-events");\n    const timelineLayout = document.querySelector(".timeline-layout");',
              '    const scheduleEvents = document.querySelector(".schedule-events");\n    const scheduleRange = document.querySelector(".day-schedule-header span");\n    const timelineLayout = document.querySelector(".timeline-layout");'
            ],
            [
              '      scheduleTitle.textContent = `${tripDetails[filter]?.label || "선택한 날짜"} 시간표`;\n      scheduleTimes.innerHTML = Array.from({ length: 12 }, (_, index) => `<div class="schedule-time">${String(index + 8).padStart(2, "0")}:00</div>`).join("");',
              '      scheduleTitle.textContent = `${tripDetails[filter]?.label || "선택한 날짜"} 시간표`;\n      const scheduleStartHour = filter === "21" ? 10 : 8;\n      const scheduleEndHour = filter === "21" ? 21 : 19;\n      scheduleRange.textContent = `${String(scheduleStartHour).padStart(2, "0")}:00–${String(scheduleEndHour).padStart(2, "0")}:00`;\n      scheduleTimes.innerHTML = Array.from({ length: scheduleEndHour - scheduleStartHour + 1 }, (_, index) => `<div class="schedule-time">${String(index + scheduleStartHour).padStart(2, "0")}:00</div>`).join("");'
            ],
            [
              '        const scheduleStart = 8 * 60;\n        const scheduleEnd = 19 * 60;',
              '        const scheduleStart = scheduleStartHour * 60;\n        const scheduleEnd = scheduleEndHour * 60;'
            ]
          ];

          for (const [from, to] of replacements) {
            if (!html.includes(from)) {
              throw new Error(`Expected text not found: ${from.slice(0, 180)}`);
            }
            html = html.replace(from, to);
          }

          fs.writeFileSync(path, html);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-aug21-night-route.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-work/2026/01-vacation/index.html .github/workflows/patch-aug21-night-route.yml
          git commit -m "Update Aug 21 Gyeongju night route schedule"
          git push
