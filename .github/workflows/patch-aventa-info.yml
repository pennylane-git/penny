name: patch-aventa-info

on:
  push:
    paths:
      - .github/workflows/patch-aventa-info.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Aventa hotel address and map
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'personal-work/2026/01-vacation/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const naverMap = 'https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EC%95%84%EB%B2%A4%ED%83%80%ED%98%B8%ED%85%94%20%ED%83%9C%EC%A2%85%EB%A1%9C685%EB%B2%88%EA%B8%B8%2028';
          const address = '경상북도 경주시 태종로685번길 28';

          const stayBefore = `            <dt>지역</dt><dd>경주시</dd>\n            <dt>체크인</dt><dd>8월 19일 수요일 16:00</dd>`;
          const stayAfter = `            <dt>지역</dt><dd>경주시</dd>\n            <dt>주소</dt><dd>${address}</dd>\n            <dt>지도</dt><dd><a class="card-link" href="${naverMap}" target="_blank" rel="noreferrer">네이버 지도에서 보기 ↗</a></dd>\n            <dt>체크인</dt><dd>8월 19일 수요일 16:00</dd>`;
          if (!html.includes(stayAfter)) {
            if (!html.includes(stayBefore)) throw new Error('Aventa stay card anchor not found');
            html = html.replace(stayBefore, stayAfter);
          }

          const contextBefore = `      19: [\n        { title: "통행료 예산", text: "승용차 편도 약 15,000원 기준으로 잡고, 실제 요금은 진입·진출 IC와 할인 적용에 따라 출발 전에 확인하세요." },`;
          const contextAfter = `      19: [\n        { title: "Aventa Hotel 주소", text: "${address}. 경주 첫 숙소이며 8월 19일 16:00 체크인, 8월 22일 12:00 체크아웃입니다.", href: "${naverMap}", link: "네이버 지도 ↗" },\n        { title: "통행료 예산", text: "승용차 편도 약 15,000원 기준으로 잡고, 실제 요금은 진입·진출 IC와 할인 적용에 따라 출발 전에 확인하세요." },`;
          if (!html.includes(contextAfter)) {
            if (!html.includes(contextBefore)) throw new Error('Aventa context anchor not found');
            html = html.replace(contextBefore, contextAfter);
          }

          const day22Before = `      22: [\n        { title: "이동 순서", text: "12:00 Aventa 퇴실 → 한화리조트 경주 담톤 15:00 입실 → 16:00 국립경주박물관 방문." },`;
          const day22After = `      22: [\n        { title: "Aventa Hotel 위치", text: "${address}. 체크아웃 후 한화리조트 경주 담톤으로 이동합니다.", href: "${naverMap}", link: "네이버 지도 ↗" },\n        { title: "이동 순서", text: "12:00 Aventa 퇴실 → 한화리조트 경주 담톤 15:00 입실 → 16:00 국립경주박물관 방문." },`;
          if (!html.includes(day22After)) {
            if (!html.includes(day22Before)) throw new Error('Aventa day 22 anchor not found');
            html = html.replace(day22Before, day22After);
          }

          fs.writeFileSync(path, html);
          NODE
          rm .github/workflows/patch-aventa-info.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-work/2026/01-vacation/index.html .github/workflows/patch-aventa-info.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Aventa hotel address and map"
            git push
          fi
