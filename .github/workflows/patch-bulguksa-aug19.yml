name: patch-bulguksa-aug19

on:
  push:
    paths:
      - .github/workflows/patch-bulguksa-aug19.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Aug 19 Bulguksa schedule
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'personal-work/2026/01-vacation/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '<div class="day start"><span class="num">19</span><button class="event green-event" type="button" data-date="19">서울 양재 출발<small>09:00 · 경주 약 4시간 20분 + 점심</small></button><button class="event green-event" type="button" data-date="19">Aventa Hotel<small>14:20 도착 예상 · 체크인 16:00</small></button></div>',
              '<div class="day start"><span class="num">19</span><button class="event green-event" type="button" data-date="19">서울 톨게이트 통과<small>10:57 · 경주 이동 중</small></button><button class="event green-event" type="button" data-date="19">Aventa Hotel<small>16:00 전후 도착 · 체크인</small></button><button class="event green-event" type="button" data-date="19">불국사<small>17:00–18:30 · 저녁 관람</small></button></div>'
            ],
            [
              '<div><strong>서울 양재 출발 → 경주 이동</strong><p>대우양재디오빌·양재역 인근에서 09:00 출발, 금강휴게소 점심·휴식 1시간 포함</p><p>아벤타 호텔 14:20 도착 예상 · 체크인 16:00</p></div>',
              '<div><strong>서울 톨게이트 통과 → 경주 이동·불국사</strong><p>10:57 경부고속도로 서울 톨게이트 통과 기준으로 경주 이동, 중간 점심·휴식 포함</p><p>Aventa 16:00 전후 체크인 후 17:00 불국사 저녁 관람으로 조정</p></div>'
            ],
            [
              '<p>09:00 양재 출발 기준 자동차 약 4시간 20분입니다. 금강휴게소 점심·휴식 1시간을 포함해 14:20 전후 도착으로 여유 있게 잡으세요.</p>',
              '<p>10:57 서울 톨게이트 통과 기준으로 경주 이동 중입니다. 중간 점심·휴식 후 Aventa 체크인, 17:00 전후 불국사 저녁 관람으로 조정합니다.</p>'
            ],
            [
              'all: { label: "전체 일정", progress: "10일", title: "양재에서 경주·충남·광주까지", description: "8월 19일 09:00 양재 출발부터 28일 광주 체크아웃까지의 전체 일정을 확인하세요.", day: "전체 보기" },\n      19: { label: "8월 19일 수요일", progress: "1일차", title: "서울 양재 출발 → 경주", description: "09:00 출발 · 금강휴게소 점심·휴식 1시간 포함 · 아벤타 호텔 14:20 도착 예상 · 체크인 16:00", day: "경주" },',
              'all: { label: "전체 일정", progress: "10일", title: "양재에서 경주·충남·광주까지", description: "8월 19일 경주 이동·불국사 저녁 관람부터 28일 광주 체크아웃까지의 전체 일정을 확인하세요.", day: "전체 보기" },\n      19: { label: "8월 19일 수요일", progress: "1일차", title: "서울 톨게이트 → 경주·불국사", description: "10:57 서울 톨게이트 통과 · 중간 점심·휴식 · Aventa 16:00 전후 체크인 · 17:00 불국사 저녁 관람", day: "경주" },'
            ],
            [
              '19: {\n        kicker: "8월 19일 이동",\n        title: "서울 양재 → 경주 이동 정보",\n        description: "09:00 출발 후 금강휴게소에서 1시간 점심·휴식을 포함해 14:20 경주 도착을 예상합니다.",\n        map: "https://map.naver.com/p/search/%EA%B8%88%EA%B0%95%ED%9C%B4%EA%B2%8C%EC%86%8C%20%EB%B6%80%EC%82%B0%EB%B0%A9%ED%96%A5",\n        link: "#plans",\n        linkLabel: "점심 후보 보기"\n      },',
              '19: {\n        kicker: "8월 19일 이동·관람",\n        title: "서울 톨게이트 → 경주·불국사",\n        description: "10:57 서울 톨게이트 통과 기준으로 경주 이동 후 Aventa 체크인, 저녁에는 불국사를 짧게 관람하는 흐름입니다. 호텔에서 16:30 전후 다시 출발하는 것을 목표로 잡습니다.",\n        map: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC",\n        link: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC",\n        linkLabel: "불국사 지도"\n      },'
            ],
            [
              '19: [\n        { title: "Aventa Hotel 주소", text: "경상북도 경주시 태종로685번길 28. 경주 첫 숙소이며 8월 19일 16:00 체크인, 8월 22일 12:00 체크아웃입니다.", href: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EC%95%84%EB%B2%A4%ED%83%80%ED%98%B8%ED%85%94%20%ED%83%9C%EC%A2%85%EB%A1%9C685%EB%B2%88%EA%B8%B8%2028", link: "네이버 지도 ↗" },',
              '19: [\n        { title: "Aventa Hotel 주소", text: "경상북도 경주시 태종로685번길 28. 경주 첫 숙소이며 8월 19일 16:00 체크인, 8월 22일 12:00 체크아웃입니다.", href: "https://map.naver.com/p/search/%EA%B2%BD%EC%A3%BC%20%EC%95%84%EB%B2%A4%ED%83%80%ED%98%B8%ED%85%94%20%ED%83%9C%EC%A2%85%EB%A1%9C685%EB%B2%88%EA%B8%B8%2028", link: "네이버 지도 ↗" },\n        { title: "불국사 저녁 관람", text: "호텔에서 16:30 전후 출발하면 17:00 전후 도착해 다보탑·석가탑·대웅전 중심으로 60–90분 짧게 관람합니다. 늦어지면 동궁과 월지 야경으로 전환하세요.", href: "https://map.naver.com/p/search/%EB%B6%88%EA%B5%AD%EC%82%AC", link: "네이버 지도 ↗" },'
            ],
            [
              '19: [\n        { start: "09:00", end: "11:00", title: "양재 → 금강휴게소 이동", detail: "고속도로 중심 이동", kind: "travel" },\n        { start: "11:00", end: "12:00", title: "금강휴게소 점심·휴식", detail: "식사·화장실·충전 확인", kind: "stay" },\n        { start: "12:00", end: "14:20", title: "금강휴게소 → 경주 이동", detail: "점심 후 Aventa Hotel 이동", kind: "travel" },\n        { start: "16:00", end: "17:00", title: "Aventa Hotel 체크인", detail: "경주 도착 후 체크인", kind: "stay" },\n        { start: "18:00", end: "19:00", title: "저녁 식사", detail: "경주 저녁 식사", kind: "stay" }\n      ],',
              '19: [\n        { start: "10:57", end: "13:10", title: "서울 톨게이트 → 휴게소 이동", detail: "경부고속도로 진입·경주 방향 이동", kind: "travel" },\n        { start: "13:10", end: "13:50", title: "점심·휴식", detail: "휴게소 식사·화장실·충전 확인", kind: "stay" },\n        { start: "13:50", end: "16:00", title: "휴게소 → 경주 이동", detail: "Aventa Hotel 도착·체크인 준비", kind: "travel" },\n        { start: "16:00", end: "16:30", title: "Aventa Hotel 체크인", detail: "짐 정리 후 바로 출발 준비", kind: "stay" },\n        { start: "16:30", end: "17:00", title: "Aventa → 불국사 이동", detail: "저녁 관람 이동", kind: "travel" },\n        { start: "17:00", end: "18:30", title: "불국사 저녁 관람", detail: "다보탑·석가탑·대웅전 중심 짧은 관람", kind: "travel" },\n        { start: "18:30", end: "19:00", title: "불국사 → 저녁 식사 이동", detail: "관람 후 식사 장소로 이동", kind: "travel" }\n      ],'
            ]
          ];

          for (const [from, to] of replacements) {
            if (!html.includes(from)) {
              throw new Error(`Expected text not found: ${from.slice(0, 120)}`);
            }
            html = html.replace(from, to);
          }

          fs.writeFileSync(path, html);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-bulguksa-aug19.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-work/2026/01-vacation/index.html .github/workflows/patch-bulguksa-aug19.yml
          git commit -m "Update Aug 19 Bulguksa evening schedule"
          git push
