name: patch-resom-reservation

on:
  push:
    paths:
      - .github/workflows/patch-resom-reservation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Resom reservation details
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'personal-work/2026/01-vacation/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const oldStay = `          <p>워터파크 이용 시 아쿠아 슈즈와 모자 착용 안내가 있습니다.</p>\n          <dl>\n            <dt>입실일</dt><dd>2026년 8월 25일, 1박</dd>\n            <dt>객실</dt><dd>플렉스타워 G40 플렉스 콘도 1실, 정원 5인</dd>\n            <dt>체크인</dt><dd>15:00</dd>\n            <dt>체크아웃</dt><dd>11:00</dd>\n            <dt>주소</dt><dd>충청남도 예산군 덕산면 온천단지3로 45-7</dd>\n            <dt>전화</dt><dd><a href="tel:0413308000">041-330-8000</a></dd>\n          </dl>`;
          const newStay = `          <p>2026년 8월 25일 1박 예약입니다. 예약번호·회원번호·회원명·이용자명은 공개 페이지에서 제외했습니다.</p>\n          <dl>\n            <dt>리조트</dt><dd>스플라스 리솜</dd>\n            <dt>입실일</dt><dd>2026년 8월 25일 화요일, 1박</dd>\n            <dt>객실</dt><dd>플렉스타워 G40 플렉스 콘도 1실</dd>\n            <dt>정원</dt><dd>5인</dd>\n            <dt>체크인</dt><dd>15:00 · 노약자·임산부 객실 우선배정은 프런트 사전 문의 필요</dd>\n            <dt>체크아웃</dt><dd>8월 26일 수요일 11:00</dd>\n            <dt>필수</dt><dd>신분증 또는 회원카드 제시 필수</dd>\n            <dt>객실 제한</dt><dd>객실 내 흡연·구이·취사도구 반입 제한, 반려동물 동반 입장 불가</dd>\n            <dt>취소/변경</dt><dd>비수기 주중은 이용일 2일 전까지, 주말·성수기는 이용일 10일 전까지 가능. 임박 취소·변경·노쇼 시 위약금 발생</dd>\n            <dt>위약규정</dt><dd><a class="card-link" href="https://m.site.naver.com/1OZeJ" target="_blank" rel="noreferrer">자세히 보기 ↗</a></dd>\n            <dt>워터파크</dt><dd>아쿠아 슈즈와 모자 착용 필수. 슬리퍼·조리·크록스 불가</dd>\n            <dt>주변 관광</dt><dd><a href="https://m.site.naver.com/1QXWm" target="_blank" rel="noreferrer">관광지 안내 ↗</a></dd>\n            <dt>RE:O</dt><dd><a href="https://m.site.naver.com/1YSQ4" target="_blank" rel="noreferrer">요가명상·싱잉볼테라피·키즈요가 사전신청 ↗</a></dd>\n            <dt>주소</dt><dd>충청남도 예산군 덕산면 온천단지3로 45-7</dd>\n            <dt>전화</dt><dd><a href="tel:0413308000">041-330-8000</a></dd>\n          </dl>`;
          if (!html.includes(newStay)) {
            if (!html.includes(oldStay)) throw new Error('Resom stay card anchor not found');
            html = html.replace(oldStay, newStay);
          }

          const oldGuide = `<dl><dt>현재 확정</dt><dd>Aventa 16:00 입실·12:00 퇴실</dd><dt>스플라스 리솜</dt><dd>예산 덕산 온천단지3로 45-7 · 041-330-8000</dd><dt>확인 필요</dt><dd>한화리조트 퇴실·짐 보관 가능 여부</dd></dl>`;
          const newGuide = `<dl><dt>현재 확정</dt><dd>Aventa 16:00 입실·12:00 퇴실</dd><dt>스플라스 리솜</dt><dd>8월 25일 1박 · 플렉스타워 G40 플렉스 콘도 1실 · 정원 5인 · 15:00 입실/11:00 퇴실 · 신분증 또는 회원카드 필수</dd><dt>확인 필요</dt><dd>한화리조트 퇴실·짐 보관 가능 여부</dd></dl>`;
          if (!html.includes(newGuide)) {
            if (!html.includes(oldGuide)) throw new Error('Guide card anchor not found');
            html = html.replace(oldGuide, newGuide);
          }

          const oldSupport = `      25: [\n        { title: "숙소 주소", text: "충청남도 예산군 덕산면 온천단지3로 45-7" },\n        { title: "대표 전화", text: "041-330-8000 · 체크인 전 객실·짐 보관 문의" },\n        { title: "체크인", text: "15:00 입실 · 플렉스타워 G40 플렉스 콘도 · 1박" },\n        { title: "워터파크 준비", text: "아쿠아슈즈와 모자 착용이 필요합니다. 운영시간·대여 여부도 확인하세요.", href: "https://www.resom.co.kr/spa/water/guide.asp", link: "공식 이용 안내 ↗" }\n      ]`;
          const newSupport = `      25: [\n        { title: "예약 요약", text: "스플라스 리솜 · 2026년 8월 25일 1박 · 플렉스타워 G40 플렉스 콘도 1실 · 객실 정원 5인. 예약번호·회원번호 등 식별 정보는 공개 페이지에서 제외했습니다." },\n        { title: "입·퇴실", text: "입실 15:00, 퇴실 11:00. 노약자·임산부 객실 우선배정은 프런트 사전 문의가 필요합니다." },\n        { title: "이용 제한", text: "객실 내 흡연·구이·취사도구 반입 제한, 반려동물 동반 입장 불가. 신분증 또는 회원카드 제시가 필수입니다." },\n        { title: "취소·변경", text: "비수기 주중은 이용일 2일 전까지, 주말·성수기는 이용일 10일 전까지 가능. 임박 취소·변경·노쇼 시 위약금이 발생합니다.", href: "https://m.site.naver.com/1OZeJ", link: "위약규정 ↗" },\n        { title: "워터파크 준비", text: "아쿠아 슈즈와 모자 착용 필수. 슬리퍼·조리·크록스는 불가합니다." },\n        { title: "주변 관광지", text: "스플라스 리솜 주변 관광지를 출발 전에 확인하세요.", href: "https://m.site.naver.com/1QXWm", link: "관광지 안내 ↗" },\n        { title: "RE:O 프로그램", text: "요가명상, 싱잉볼테라피, 키즈요가 등 사전신청 가능 프로그램을 확인하세요.", href: "https://m.site.naver.com/1YSQ4", link: "사전신청 ↗" }\n      ]`;
          if (!html.includes(newSupport)) {
            if (!html.includes(oldSupport)) throw new Error('Resom support anchor not found');
            html = html.replace(oldSupport, newSupport);
          }

          fs.writeFileSync(path, html);
          NODE
          rm .github/workflows/patch-resom-reservation.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-work/2026/01-vacation/index.html .github/workflows/patch-resom-reservation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Resom reservation details"
            git push
          fi
